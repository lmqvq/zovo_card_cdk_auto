name: one-off release v1.4.34.4

on:
  push:
    branches:
      - custom

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point release tag to this custom commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f v1.4.34.4 "${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/tags/v1.4.34.4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set release version
        run: echo '1.4.34.4' > VERSION

      - name: Build backend
        working-directory: backend
        run: |
          mkdir -p ../dist
          bash ../scripts/build-linux-backend.sh "${GITHUB_WORKSPACE}/dist/cdk-recharge" "1.4.34.4"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          mkdir -p ../dist/web
          cp -a dist/. ../dist/web/

      - name: Pack release bundle
        run: |
          cp VERSION dist/VERSION
          tar -C dist -czf cdk-bundle-linux-amd64.tgz cdk-recharge web VERSION
          sha256sum cdk-bundle-linux-amd64.tgz | tee cdk-bundle-linux-amd64.tgz.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.34.4
          name: v1.4.34.4
          body: |
            ## 本次更新

            - 首页新增“可视化兑换流程”入口，放置在四个功能卡片与“操作流程”区域之间。
            - 链接文字为“可视化兑换流程”，点击后在新标签页打开腾讯文档图文教程。
            - 兑换页继续隐藏“邮箱”按钮，邮箱接口和相关处理代码保持不变。
            - 保留现有后端、数据库、配置和数据，不涉及数据库结构变更。

            ## 发布信息

            - 版本：v1.4.34.4
            - 来源分支：custom
            - 构建产物：Linux amd64 一键更新包
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            cdk-bundle-linux-amd64.tgz
            cdk-bundle-linux-amd64.tgz.sha256
            VERSION
